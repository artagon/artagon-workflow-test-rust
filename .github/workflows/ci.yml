# Rust CI Test Workflow
#
# Tests the artagon-workflows Rust CI reusable workflow.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 2 AM UTC to catch any breaking changes
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      rust-version:
        description: 'Rust version to test'
        required: false
        default: 'stable'
  repository_dispatch:
    types: [workflow-updated, release-published]

jobs:
  # Test with default configuration
  test-default:
    name: Test Default Configuration
    uses: artagon/artagon-workflows/.github/workflows/rust_ci.yml@main
    secrets: inherit

  # Test with stable Rust
  test-stable:
    name: Test Stable Rust
    uses: artagon/artagon-workflows/.github/workflows/rust_ci.yml@main
    with:
      rust-version: 'stable'
    secrets: inherit

  # Test with nightly Rust (allow failures)
  test-nightly:
    name: Test Nightly Rust
    uses: artagon/artagon-workflows/.github/workflows/rust_ci.yml@main
    with:
      rust-version: 'nightly'
    secrets: inherit
    # Nightly may have breaking changes, don't block on it
    continue-on-error: true

  # Test with coverage disabled
  test-no-coverage:
    name: Test Without Coverage
    uses: artagon/artagon-workflows/.github/workflows/rust_ci.yml@main
    with:
      rust-version: 'stable'
      enable-coverage: false
    secrets: inherit

  # Test with specific MSRV (Minimum Supported Rust Version)
  test-msrv:
    name: Test MSRV (1.70)
    uses: artagon/artagon-workflows/.github/workflows/rust_ci.yml@main
    with:
      rust-version: '1.70'
      enable-coverage: false
    secrets: inherit
